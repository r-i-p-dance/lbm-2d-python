[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lbm"
version = "0.1.0"
description = "2D lattice Boltzmann solver"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "numba",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lbm*"]